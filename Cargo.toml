[package]
name = "pyjpegxl"
version = "0.3.0"
edition = "2021"
description = "Python bindings for JPEG XL encoding/decoding via jpegxl-rs"

[lib]
name = "pyjpegxl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
jpegxl-rs = { version = "0.15", features = ["vendored"] }
jpegxl-sys = { version = "0.13", features = ["vendored"] }
numpy = "0.29.0"
turbojpeg = { version = "1.5", default-features = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
